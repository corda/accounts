import static org.gradle.api.JavaVersion.VERSION_17

buildscript {
    ext {
        accounts_release_group = 'com.r3.corda.lib.accounts'
        accounts_release_version = '1.1'
        corda_release_group = 'net.corda'
        // The Corda version to build and test against: the default is in gradle.properties, -PcordaReleaseVersion=4.15-RC02
        // on the command line gives a Corda 4.15 (Hibernate 7) build. A jar built against 4.12 runs on both 4.12 and 4.15
        // nodes; one built against 4.15 runs on 4.15 only.
        corda_release_version = cordaReleaseVersion
        tokens_release_group = 'com.r3.corda.lib.tokens'
        // The Token SDK version the examples use: the default is in gradle.properties, -PtokensReleaseVersion=... overrides it.
        tokens_release_version = tokensReleaseVersion
        confidential_id_release_group = "com.r3.corda.lib.ci"
        confidential_id_release_version = "1.2.7"

        corda_gradle_plugins_version = '5.1.3'
        mavenVersion = '3.1.0'
        maven_resolver_version = "1.1.1"
        kotlin_version = '1.9.0'
        junit_version = '4.12'
        quasar_version = '0.9.1_r3'
        log4j_version = '2.25.5'
        spring_boot_version = '3.1.2'
        servlet_version = '4.0.1'

        test_module_opens = [
                '--add-opens', 'java.base/java.time=ALL-UNNAMED', '--add-opens', 'java.base/java.io=ALL-UNNAMED',
                '--add-opens', 'java.base/java.util=ALL-UNNAMED', '--add-opens', 'java.base/java.net=ALL-UNNAMED',
                '--add-opens', 'java.base/java.nio=ALL-UNNAMED', '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
                '--add-opens', 'java.base/java.security.cert=ALL-UNNAMED', '--add-opens', 'java.base/java.security=ALL-UNNAMED',
                '--add-opens', 'java.base/javax.net.ssl=ALL-UNNAMED', '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED', '--add-opens', 'java.sql/java.sql=ALL-UNNAMED',
                '--add-opens', 'java.base/java.util.concurrent.atomic=ALL-UNNAMED', '--add-opens', 'java.base/sun.security.x509=ALL-UNNAMED',
                '--add-opens', 'java.base/sun.security.util=ALL-UNNAMED', '--add-opens', 'jdk.crypto.ec/sun.security.ec.ed=ALL-UNNAMED'
        ]
        test_module_exports = [
                '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'
        ]
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "${publicArtifactURL}/corda-releases" }
        // as last resort, check our backup of now defunc JCenter repo
        maven { url "${publicArtifactURL}/jcenter-backup" }
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "net.corda.plugins:cordformation:$corda_gradle_plugins_version"
        classpath "net.corda.plugins:quasar-utils:$corda_gradle_plugins_version"
        classpath "net.corda.plugins:cordapp:$corda_gradle_plugins_version"
    }
}

plugins {
    id 'org.jetbrains.kotlin.plugin.jpa' version "$kotlin_version" apply false
    id 'org.springframework.boot' version '3.1.2' apply false
    id "org.ajoberstar.grgit" version "4.0.0"
    id 'corda.root-publish'
}

// If the command line project option -PversionFromGit is added to the gradle invocation, we'll resolve
// the latest git commit hash and timestamp and create a version postfix from that
if (project.hasProperty("versionFromGit")) {
    ext.versionSuffix = "${grgit.head().dateTime.format("yyyyMMdd_HHmmss")}-${grgit.head().abbreviatedId}"
}

if (ext.versionSuffix != "") {
    ext.accounts_release_version = "${ext.baseVersion}-${ext.versionSuffix}".toString()
} else {
    ext.accounts_release_version = "${ext.baseVersion}".toString()
}

allprojects {
    version accounts_release_version
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'net.corda') {
                    details.useVersion corda_release_version
                    details.because 'pin all Corda modules to corda_release_version for Snyk scanning'
                }
            }
            cacheChangingModulesFor 0, 'seconds'
        }
    }
    dependencies {
        components {
            // tokens-workflows 1.3.4 and earlier declare org.hibernate:hibernate-core 5.6 at runtime scope, which Gradle cannot put
            // on one classpath with Corda 4.15 (Hibernate 7 claims the same capability). The node provides Hibernate, so the
            // dependency is dropped here (ENT-15178); Token SDK 1.3.5 no longer declares it.
            withModule("${tokens_release_group}:tokens-workflows") { ComponentMetadataDetails details ->
                details.allVariants {
                    withDependencies { deps ->
                        deps.removeAll { it.group == 'org.hibernate' }
                    }
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'net.corda.plugins.quasar-utils'

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url "${publicArtifactURL}/corda-releases"
            mavenContent {
                releasesOnly()
            }
        }
        maven { url "${publicArtifactURL}/corda-dependencies" }
        maven {
            url "${publicArtifactURL}/corda-lib"
            mavenContent {
                releasesOnly()
            }
        }
        maven {
            url "${artifactoryContextUrl}/corda-dev"
            credentials {
                username = System.getenv('CORDA_ARTIFACTORY_USERNAME')
                password = System.getenv('CORDA_ARTIFACTORY_PASSWORD')
            }
        }
        maven {
            url "${artifactoryContextUrl}/corda-lib-dev"
            credentials {
                username = System.getenv('CORDA_ARTIFACTORY_USERNAME')
                password = System.getenv('CORDA_ARTIFACTORY_PASSWORD')
            }
        }
        // Corda release candidates (for example 4.15-RC02) that are not yet on the public download site.
        maven {
            url "${artifactoryContextUrl}/corda-releases"
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = System.getenv('CORDA_ARTIFACTORY_USERNAME')
                password = System.getenv('CORDA_ARTIFACTORY_PASSWORD')
            }
        }
        maven { url "https://repo.gradle.org/gradle/libs-releases-local" }
        maven { url 'https://jitpack.io' }
        // as last resort, check our backup of now defunc JCenter repo
        maven { url "${publicArtifactURL}/jcenter-backup" }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
        kotlinOptions {
            languageVersion = "1.9"
            apiVersion = "1.9"
            jvmTarget = VERSION_17
            javaParameters = true   // Useful for reflection.
        }
    }


    tasks.withType(Test).all {
        minHeapSize = "128m"
        maxHeapSize = "4096m"
        // TestCordapp.findCordapp builds a sibling project's jar in a nested Gradle build (Tooling API) from inside the test JVM,
        // which inherits the environment but not the command line: hand the Corda version over, or the nested build rebuilds the
        // jar against the default version and overwrites it under the running tests.
        environment 'ORG_GRADLE_PROJECT_cordaReleaseVersion', corda_release_version
    }

    quasar {
        excludePackages.addAll(
                "antlr**",
                "com.codahale**",
                "com.fasterxml.**",
                "com.github.benmanes.caffeine.**",
                "com.google.**",
                "com.lmax.**",
                "com.zaxxer.**",
                "net.bytebuddy**",
                "io.github.classgraph**",
                "io.netty*",
                "liquibase**",
                "net.i2p.crypto.**",
                "nonapi.io.github.classgraph.**",
                "org.apiguardian.**",
                "org.bouncycastle**",
                "org.codehaus.**",
                "org.h2**",
                "org.hibernate**",
                "org.jboss.**",
                "org.objenesis**",
                "org.w3c.**",
                "org.xml**",
                "org.yaml**",
                "rx**",
                "kotlin**"
        )
    }
}

def publishProjects = [project(":contracts"), project(":workflows")]

configure(publishProjects) { subproject ->
    task sourceJar(type: Jar, dependsOn: subproject.classes) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    task javadocJar(type: Jar, dependsOn: subproject.javadoc) {
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
    }

    if (System.getenv("R3_EXTERNAL") != "1") {
        task install(dependsOn: 'publishToMavenLocal')
    }

    publishing {
        publications {
            create(subproject.name, MavenPublication) {
                from components.java

                groupId subproject.group
                artifactId "accounts-${subproject.name}"
                artifact tasks.sourceJar
                artifact tasks.javadocJar

                pom {
                    description = subproject.description
                }
            }
        }
    }
}
