
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.plugin.jpa'
apply plugin: 'net.corda.plugins.cordapp'
apply plugin: 'net.corda.plugins.quasar-utils'
apply plugin: 'corda.common-publishing'

cordapp {
    targetPlatformVersion 140
    minimumPlatformVersion 140
    contract {
        name "Accounts SDK - States and Contracts"
        vendor "R3"
        licence "Apache 2"
        versionId 2
    }
}

dependencies {
    // Corda integration dependencies
    cordaProvided "$corda_release_group:corda-core:$corda_release_version"

    // Both persistence APIs are compile-only and neither is bundled: the node provides the one its Hibernate version
    // implements (javax.persistence on Corda 4.14 and earlier, jakarta.persistence on Corda 4.15).
    compileOnly "javax.persistence:javax.persistence-api:$javax_persistence_version"
    compileOnly "jakarta.persistence:jakarta.persistence-api:$jakarta_persistence_version"

    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "junit:junit:$junit_version"
    testImplementation "$corda_release_group:corda-node-driver:$corda_release_version"
}

sourceSets {
    main {
        resources {
            srcDir rootProject.file("config/dev")
        }
    }
    test {
        resources {
            srcDir rootProject.file("config/test")
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId 'accounts-contracts'
            from components.cordapp
        }
    }
}
